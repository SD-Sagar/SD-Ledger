<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="50%" stopColor="#0d9488" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Inner Chassis Dark -->
    <linearGradient id="innerChassis" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="100%" stopColor="#18181b" />
    </linearGradient>

    <!-- Peeking Card Gradient -->
    <linearGradient id="cardGrad" x1="160" y1="80" x2="352" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#2dd4bf" />
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="walletBody" x1="80" y1="160" x2="432" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#064e3b" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.95" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fde047" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#innerChassis)" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#059669" fill-opacity="0.12" filter="blur(40px)" />

  <!-- 1. Peeking Top Card (Credit/Ledger statement card) -->
  <path d="M 148 180 V 124 C 148 108 161 96 178 96 H 334 C 350 96 364 108 364 124 V 180" 
        stroke="url(#cardGrad)" stroke-width="18" stroke-linecap="round" fill="none" />
  
  <!-- Register Balance Lines on peeking card -->
  <line x1="190" y1="134" x2="268" y2="134" stroke="url(#cardGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="292" y1="134" x2="322" y2="134" stroke="url(#goldAccent)" stroke-width="12" stroke-linecap="round" />

  <!-- 2. Main Wallet Body / Ledger Chassis -->
  <g filter="url(#glow)">
    <rect x="76" y="168" width="360" height="252" rx="42" fill="url(#walletBody)" stroke="#10b981" stroke-width="14" />
  </g>

  <!-- Horizontal Stitched Seam -->
  <line x1="76" y1="280" x2="436" y2="280" stroke="#059669" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.6" />

  <!-- 3. Monogram / Dual Account Indicator Pills (Left side of wallet) -->
  <circle cx="140" cy="230" r="18" fill="#10b981" />
  <circle cx="184" cy="230" r="18" fill="#38bdf8" />
  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">SD</text>
  <text x="216" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#34d399" letter-spacing="1">LEDGER</text>

  <!-- 4. Wallet Clasp & Golden Lock Mechanism (Right side flap) -->
  <path d="M 380 236 H 444 C 452 236 458 242 458 250 V 302 C 458 310 452 316 444 316 H 380" 
        fill="#18181b" stroke="#34d399" stroke-width="10" stroke-linejoin="round" />
  
  <!-- Golden Clasp Rivet & Keyhole -->
  <circle cx="424" cy="276" r="16" fill="url(#goldAccent)" stroke="#ca8a04" stroke-width="3" />
  <circle cx="424" cy="276" r="6" fill="#09090b" />
</svg>

