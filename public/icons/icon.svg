<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Gradient Border -->
    <linearGradient id="brandBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="50%" stopColor="#14b8a6" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>

    <!-- Dark Inner Canvas -->
    <linearGradient id="innerBg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="100%" stopColor="#18181b" />
    </linearGradient>

    <!-- Wallet Leather Gradient -->
    <linearGradient id="walletFill" x1="64" y1="144" x2="448" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#064e3b" stopOpacity="0.75" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="0.85" />
    </linearGradient>

    <!-- Peeking Card Gradient -->
    <linearGradient id="cardGrad" x1="128" y1="64" x2="384" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#2dd4bf" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Square with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#brandBorder)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#innerBg)" />

  <!-- Centered Scaled Exact BrandLogo (Scale ~12x centered in 512x512) -->
  <g transform="translate(64, 64) scale(12)" filter="url(#shadow)">
    <!-- 1. TOP LEDGER TAB / CARD -->
    <path
      d="M 8.5 10 V 6 C 8.5 4.9 9.4 4 10.5 4 H 21.5 C 22.6 4 23.5 4.9 23.5 6 V 10"
      stroke="url(#cardGrad)"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="rgba(56, 189, 248, 0.2)"
    />
    <line x1="12" y1="6.8" x2="17" y2="6.8" stroke="url(#cardGrad)" stroke-width="1.1" stroke-linecap="round" />
    <line x1="19" y1="6.8" x2="20.5" y2="6.8" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round" />

    <!-- 2. MAIN WALLET / LEDGER CHASSIS -->
    <rect
      x="4"
      y="9"
      width="24"
      height="18"
      rx="4"
      fill="url(#walletFill)"
      stroke="#34d399"
      stroke-width="1.8"
    />

    <!-- Horizontal Leather Stitching / Fold Seam -->
    <line
      x1="4.5"
      y1="13.2"
      x2="27.5"
      y2="13.2"
      stroke="#34d399"
      stroke-opacity="0.4"
      stroke-width="0.9"
      stroke-dasharray="1.5 1.5"
    />

    <!-- 3. EMBOSSED "SD" MONOGRAM (Personalized Touch) -->
    <rect
      x="6.5"
      y="15.5"
      width="11.5"
      height="9"
      rx="2"
      fill="rgba(52, 211, 153, 0.18)"
      stroke="#34d399"
      stroke-opacity="0.35"
      stroke-width="0.75"
    />
    <text
      x="12.2"
      y="22.5"
      text-anchor="middle"
      fill="#a7f3d0"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="7.8"
      font-weight="900"
      letter-spacing="-0.3"
    >
      SD
    </text>

    <!-- 4. WALLET CLASP & SECURITY LOCK PIN -->
    <path
      d="M 19.5 15 H 27.5 C 28.3 15 29 15.7 29 16.5 V 20.5 C 29 21.3 28.3 22 27.5 22 H 19.5 C 18 22 17 20.8 17 18.5 C 17 16.2 18 15 19.5 15 Z"
      fill="#18181b"
      stroke="#34d399"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <circle cx="20.8" cy="18.5" r="1.5" fill="#fbbf24" stroke="#d97706" stroke-width="0.4" />
    <circle cx="20.8" cy="18.5" r="0.6" fill="#09090b" />
  </g>
</svg>
